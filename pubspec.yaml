name: kharchio
description: Kharchio expense tracker UI preview.
publish_to: none
version: 0.1.1+2
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^18.1.1
  fl_chart: ^1.1.1
  intl: ^0.20.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  record: ^7.1.2
  path_provider: ^2.1.6
  ffi: ^2.2.0
  uuid: ^4.6.0
  crypto: ^3.0.6
  image_picker: ^1.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/kharchio_icon.png
    - models/manifest.json
    - models/whisper/whisper-small-metadata.dat
    - models/whisper/WHISPER-LICENSE.txt
    - models/qwen/QWEN-LICENSE.txt
    - models/licenses/
    - assets/diagnostics/model_check.wav
    - assets/diagnostics/model_check_hinglish.wav

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/kharchio_icon.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/branding/kharchio_icon.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  background_color_ios: '#FFFFFF'
